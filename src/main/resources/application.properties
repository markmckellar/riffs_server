server.port=9095
server.address=0.0.0.0
# where users.json and games.json are kept (JSON files for now; a database later)
rifts.data-dir=local/data
# the OAuth web client ID from the Google console ("Sign in with Google"); empty = Google sign-in off
rifts.auth.google-client-id=
# sign in by just typing a name: for local testing only (run_dev.bash turns it on). Never on a public server.
rifts.auth.dev-login=false
rifts.auth.session-key-file=local/session.key
rifts.auth.session-days=60
# bots play when no person is free; how long a bot "thinks" before moving (seconds)
rifts.bot.min-delay=3
rifts.bot.max-delay=8
# the built web client (rifts_wf_client_vue's dist/) is copied to local/static/ and served from / (deploy.bash)
spring.web.resources.static-locations=file:local/static/,classpath:/static/
