# The game's display name. The web client shows what the server sends, so a rename is this line plus
# VITE_GAME_NAME in riffs_client_vue/.env (see research/naming.md, "Changing the name").
riffs.game-name=Riff Rivals
server.port=9095
server.address=0.0.0.0
# where users.json and games.json are kept (JSON files for now; a database later)
riffs.data-dir=local/data
# the OAuth web client ID from the Google console ("Sign in with Google"); empty = Google sign-in off
riffs.auth.google-client-id=
# sign in by just typing a name: for local testing only (run_dev.bash turns it on). Never on a public server.
riffs.auth.dev-login=false
riffs.auth.session-key-file=local/session.key
riffs.auth.session-days=60
# bots play when no person is free; how long a bot "thinks" before moving (seconds)
riffs.bot.min-delay=3
riffs.bot.max-delay=8
# the built web client (riffs_client_vue's dist/) is copied to local/static/ and served from / (deploy.bash)
spring.web.resources.static-locations=file:local/static/,classpath:/static/
